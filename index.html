<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agende Cita - Oral Brackets</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #eef3f8, #dce8f5);
    font-family: Arial, sans-serif;
    color: #333;
}

.formulario {
    width: 100%;
    max-width: 420px;
    margin: 15px;
    background: white;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.16);
}

.logo-area {
    background: #ffffff;
    padding: 18px 20px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom: 1px solid #e8eef3;
}

.logo {
    width: min(100%, 315px);
    height: auto;
    display: block;
    object-fit: contain;
}

.encabezado {
    background: linear-gradient(135deg, #003366, #1565a8);
    color: white;
    padding: 24px 25px 27px;
    text-align: center;
}

.icono {
    font-size: 38px;
    margin-bottom: 7px;
}

.encabezado h1 {
    margin: 0;
    font-size: 23px;
    font-weight: bold;
}

.encabezado p {
    margin: 8px 0 0;
    font-size: 13px;
    line-height: 1.4;
    opacity: 0.92;
}

.formulario-body {
    padding: 28px;
}

.campo {
    margin-bottom: 20px;
}

.campo label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: bold;
    color: #003366;
}

.obligatorio {
    color: #d32f2f;
}

.campo input {
    width: 100%;
    height: 45px;
    padding: 10px 13px;
    border: 1px solid #d0d7de;
    border-radius: 13px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: #333;
    background-color: #fff;
    transition: all 0.2s ease;
}

.campo input:focus {
    outline: none;
    border-color: #1565a8;
    box-shadow: 0 0 0 3px rgba(21,101,168,0.12);
}

.responsable-wrapper {
    position: relative;
}

.responsable-wrapper input {
    padding-left: 42px;
}

.icono-persona {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 19px;
    color: #003366;
}

button {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    background: linear-gradient(135deg, #4CAF50, #388E3C);
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.16);
}

button:disabled {
    background: #999;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

#mensaje {
    text-align: center;
    margin-top: 18px;
    min-height: 22px;
    font-size: 14px;
    font-weight: bold;
}

.exito {
    color: #2e7d32;
    background-color: #e8f5e9;
    padding: 11px;
    border-radius: 13px;
}

.error {
    color: #c62828;
    background-color: #ffebee;
    padding: 11px;
    border-radius: 13px;
}

.pie-formulario {
    text-align: center;
    margin-top: 18px;
    font-size: 11px;
    color: #777;
}

@media (max-width: 500px) {
    body {
        align-items: flex-start;
        padding-top: 15px;
    }

    .formulario {
        margin: 5px;
        border-radius: 26px;
    }

    .formulario-body {
        padding: 22px;
    }

    .logo-area {
        padding: 15px 14px 11px;
    }
}
</style>
</head>

        </div>

            </label>
            <input type="time" id="hora" required>
        </div>

                id="tarea"
                placeholder="Escriba el motivo de la cita"
                required>
        </div>

            📅 ENVIAR CITA
        </button>

        <div class="pie-formulario">
            Los campos marcados con * son obligatorios.
        </div>

    </div>

<script>
async function enviarCita() {

    const fecha = document.getElementById("fecha").value;
    const hora = document.getElementById("hora").value;
    const responsable = document.getElementById("responsable").value.trim();
    const tarea = document.getElementById("tarea").value.trim();

    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("btnEnviar");

    if (!fecha || !hora || !responsable || !tarea) {
        mensaje.className = "error";
        mensaje.innerHTML = "⚠️ Complete todos los campos.";
        return;
    }

    boton.disabled = true;
    boton.innerHTML = "⏳ REGISTRANDO CITA...";
    mensaje.className = "";
    mensaje.innerHTML = "Enviando información...";

    const datos = {
        fecha: fecha,
        hora: hora,
        responsable: responsable,
        tarea: tarea
    };

    try {

        const respuesta = await fetch(
            "https://defaultb0364bc53bfe4864a2ed3ebb68c608.ad.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/7b179c0376af4fd5bb6c9ff23b949859/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=XKrzIRP0OBFmvlYzcSU83qO2uovsZaEikW7205L1fCo",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            }
        );

        if (respuesta.ok) {

            mensaje.className = "exito";
            mensaje.innerHTML = "✓ Cita registrada correctamente.";

            document.getElementById("fecha").value = "";
            document.getElementById("hora").value = "";
            document.getElementById("tarea").value = "";

        } else {

            mensaje.className = "error";
            mensaje.innerHTML = "❌ No se pudo registrar la cita.";

        }

    } catch (error) {

        console.error("Error:", error);

        mensaje.className = "error";
        mensaje.innerHTML = "❌ Error de conexión con Power Automate.";

    }

    boton.disabled = false;
    boton.innerHTML = "📅 ENVIAR CITA";
}
</script>
